    <script>
      // Gracefully handle Vite HMR WebSocket in cloud preview per environment constraints ("HMR: Disabled. Ignore WebSocket errors.")
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1))) {
              var listeners = {};
              var dummy = {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                addEventListener: function(event, fn) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(fn);
                  if (event === 'open') {
                    setTimeout(function() { fn({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(cb) { return cb !== fn; });
                  }
                },
                send: function() {},
                close: function() {}
              };
              return dummy;
            }
            return new (Function.prototype.bind.apply(NativeWebSocket, [null].concat(Array.prototype.slice.call(arguments))))();
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        }

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason) {
            var msg = String(e.reason.message || e.reason);
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('closed without opened') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              var str = String(arg.message || arg);
              if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1 || str.indexOf('failed to connect to websocket') !== -1) {
                return;
              }
            }
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('metany_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
